name: SpringBoot Pipeline

on: 
  push:
    branches:
      - main
      - dev
      - feature*
  pull_request:
    branches: ["main", "dev"]

jobs:
  Checkout:
    name: Checkout
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4
          
  pre-build:
    name: Pre-build
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with: 
          java-version: '17'
          distribution: 'temurin'
      - name: Run Maven Lint Check 
        run: mvn clean install -Dcheckstyle.skip=true

  Build:
    name: Build
    runs-on: ubuntu-latest
    needs: pre-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean package -DskipTests -Build

      - name: Upload Atrifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*jar
          retention-days: 1
          
