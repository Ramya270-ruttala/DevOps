name: SpringBoot Pipeline

permissions:
  contents: write
  checks: write

on: 
  push:
    branches:
      - main
      - dev
      - feature*
  pull_request:
    branches: ["main", "dev"]

jobs:
  Checkout:
    name: Checkout
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4
          
  pre-build:
    name: Pre-build
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with: 
          java-version: '17'
          distribution: 'temurin'
      - name: Run Maven Lint Check 
        run: mvn clean install -Dcheckstyle.skip=true

  Build:
    name: Build
    runs-on: ubuntu-latest
    needs: pre-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload Atrifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*jar
          retention-days: 1
  
  Test:
    name: Test
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Atrifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app
          path: target
      - name: Run Unit Tests
        run: mvn test 
      - name: Upload JUnit XML Reports
        uses: actions/upload-artifact@v4
        with: 
          name: junit-xml-reports 
          path: target/surefire-reports/*
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
